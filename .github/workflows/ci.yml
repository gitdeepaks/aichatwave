name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the older run: the old result is
# about to be irrelevant and the queue is shared.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a
# movable pointer the action's owner can repoint at any time, including at
# code that reads this repository's secrets — the supply-chain attack that has
# actually happened to GitHub Actions users, more than once. The trailing
# comment records the human-readable version so Dependabot can bump both
# together; it is documentation, not the thing being resolved.

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values only. `next build` talks to nothing — it needs these
    # solely because `lib/env.ts` validates the environment as an import side
    # effect, and Next evaluates server modules during page-data collection.
    #
    # POLAR_SERVER is deliberately NOT set. It is required at runtime under
    # NODE_ENV=production but exempt during `next build`, and that exemption is
    # what unblocked deploys after the billing incident. Leaving it unset here
    # means CI fails the moment someone regresses the guard back to build time.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXItMDAwLmNsZXJrLmFjY291bnRzLmRldiQ
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      OPENAI_API_KEY: sk-ci-placeholder
      POLAR_ACCESS_TOKEN: polar_oat_ci_placeholder
      POLAR_PRODUCT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build. Each step runs even if an earlier one failed,
      # so one push surfaces every problem instead of one per re-run.
      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Blocking, at high and critical, over production dependencies only.
      #
      # The advisories that have already been reviewed and accepted are listed
      # by GHSA id in `pnpm.auditConfig.ignoreGhsas` in package.json, with the
      # reasoning recorded in docs/pro_plan.md under Phase D. That is what makes
      # this gate usable: an accepted advisory is named and argued for once,
      # and anything *new* fails the build. A severity threshold alone would
      # either block on advisories nobody can fix from this repo, or wave
      # through the next one that lands.
      #
      # `--prod` because a dev-only advisory cannot be reached by a user; those
      # show up in the advisory run below and in Dependabot's PRs.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high --prod

      # Everything, including dev dependencies and the accepted list, for
      # triage. Never blocks.
      - name: Audit dependencies (advisory, non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm audit --audit-level low

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret committed and later deleted is still in the
          # repository, and a shallow clone would not see it.
          fetch-depth: 0

      # Run the binary via its own image rather than the marketplace action,
      # which asks organisation accounts for a licence key. Config and
      # allowlisting live in .gitleaks.toml.
      #
      # Pinned to a release tag rather than `:latest`, for the same reason the
      # actions above are pinned to SHAs: `:latest` is whatever was pushed most
      # recently, and this step runs with the repository checked out.
      #
      # `git` scans every commit reachable from the checkout, which is the
      # actual requirement: a secret added and later deleted still sits in
      # history and a working-tree scan would miss it. `--redact` keeps any
      # finding out of the public log; the file and commit are enough to act on.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --verbose --exit-code 1 .
